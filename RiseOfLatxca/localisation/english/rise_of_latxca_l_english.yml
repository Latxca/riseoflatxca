 LAX_GATHERING_STORM_DESC:0 "The United Parishes of Latxca begin as a fragile democratic republic, seeking to unite the founding parishes through constitutional government and national reform."

 LAX_found_the_republic:0 "Found the Republic"
 LAX_found_the_republic_desc:0 "Unite the parishes and establish a new republican order in Latxca."
 LAX_congress_of_parishes:0 "Congress of Parishes"
 LAX_congress_of_parishes_desc:0 "Gather the representatives of the founding parishes and bind the republic together through constitutional debate."
 LAX_defend_the_constitution:0 "Defend the Constitution"
 LAX_defend_the_constitution_desc:0 "Protect the republican charter from factional interference and preserve democratic legitimacy."
 LAX_republican_guard:0 "Raise the Republican Guard"
 LAX_republican_guard_desc:0 "Create a loyal force to safeguard the republic and keep the peace between the parishes."
 LAX_national_reconstruction:0 "National Reconstruction"
 LAX_national_reconstruction_desc:0 "Rebuild the infrastructure and economy of the young union."
 LAX_expand_the_military:0 "Expand the Military"
 LAX_expand_the_military_desc:0 "Strengthen the armed forces to defend the republic against foreign pressures."
 LAX_democratic_path:0 "Secure the Democratic Path"
 LAX_democratic_path_desc:0 "Anchor the republic in constitutional government and preserve the democratic order."
 LAX_fascist_path:0 "Embrace the National Path"
 LAX_fascist_path_desc:0 "Consolidate power under a strong executive and a disciplined state."
 LAX_communist_path:0 "Advance the People's Republic"
 LAX_communist_path_desc:0 "Turn the republic toward a workers' state and revolutionary transformation."
 LAX_strengthen_the_presidency:0 "Strengthen the Presidency"
 LAX_strengthen_the_presidency_desc:0 "Give the executive the authority to guide the nation through crisis."
 LAX_war_cabinet:0 "Form a War Cabinet"
 LAX_war_cabinet_desc:0 "Prepare the state for total mobilization and wartime leadership."
 LAX_national_security:0 "National Security Doctrine"
 LAX_national_security_desc:0 "Build a coercive security apparatus that can enforce order at home and abroad."
 LAX_reform_the_senate:0 "Reform the Senate"
 LAX_reform_the_senate_desc:0 "Adjust the upper chamber to better reflect the needs of the union."
 LAX_peoples_assembly:0 "Create a People's Assembly"
 LAX_peoples_assembly_desc:0 "Establish a broader popular body to rally support for the revolutionary state."
 LAX_party_state:0 "Build the Party State"
 LAX_party_state_desc:0 "Centralize authority under a disciplined ruling party."
 LAX_congressional_tradition:0 "Congressional Tradition"
 LAX_congressional_tradition_desc:0 "The legislature gains weight as the republic's constitutional center."
 LAX_presidential_dominance:0 "Presidential Dominance"
 LAX_presidential_dominance_desc:0 "The executive assumes greater authority over the state in times of crisis."
 LAX_revolutionary_zeal:0 "Revolutionary Zeal"
 LAX_revolutionary_zeal_desc:0 "The people are mobilized behind a new revolutionary settlement."
 LAX_consult_the_congress:0 "Consult the Congress"
 LAX_consult_the_congress_desc:0 "Bring the parliamentary institutions into the center of national decision-making."
 LAX_revolutionary_commissars:0 "Appoint Revolutionary Commissars"
 LAX_revolutionary_commissars_desc:0 "Embed ideological oversight into the administration of the state."
 LAX_presidential_election:0 "Hold a Presidential Election"
 LAX_presidential_election_desc:0 "Legitimize the state through a national election."
 LAX_people_united:0 "The People United"
 LAX_people_united_desc:0 "Unite the working masses behind the new order."
 LAX_central_council:0 "Central Council"
 LAX_central_council_desc:0 "Gather the key institutions of the republic into a single council to steer the nation through crisis."
 LAX_final_union:0 "The Final Union"
 LAX_final_union_desc:0 "Bring the new constitutional or revolutionary settlement to its conclusion."
 LAX_political_struggle.1.t:0 "The Battle for the Presidency"
 LAX_political_struggle.1.d:0 "Congress and the president are now locked in a struggle over who will direct the future of Latxca."
 LAX_political_struggle.1.a:0 "Back the Congress"
 LAX_political_struggle.1.b:0 "Back the Presidency"
 LAX_congress_support_drive:0 "Launch a Congress Support Drive"
 LAX_congress_support_drive_desc:0 "Mobilize party organizers and civic allies to shore up support in the legislature."
 LAX_congress_appeal_to_parishes:0 "Appeal to the Parishes"
 LAX_congress_appeal_to_parishes_desc:0 "Travel the union to rally local leaders and secure backing for the government."
 LAX_congressional_reform_push:0 "Push for Congressional Reform"
 LAX_congressional_reform_push_desc:0 "Reform legislative procedures to strengthen the chamber's influence."
 LAX_presidential_pressure_campaign:0 "Pressure the Presidency"
 LAX_presidential_pressure_campaign_desc:0 "Use public pressure and procedural maneuvering to weaken executive dominance."
 LAX_congress.1.t:0 "Support in the Chamber"
 LAX_congress.1.d:0 "A wave of public support has strengthened your position in the congress."
 LAX_congress.1.a:0 "Good news"
 LAX_congress.2.t:0 "Parish Leaders Rally"
 LAX_congress.2.d:0 "Local leaders from across the union have pledged their backing to the legislature."
 LAX_congress.2.a:0 "Excellent"
 LAX_congress.3.t:0 "Reformers Gain Ground"
 LAX_congress.3.d:0 "Opposition to executive overreach is gaining traction in the congress."
 LAX_congress.3.a:0 "Proceed"
 LAX_congress.4.t:0 "The Presidency Pushes Back"
 LAX_congress.4.d:0 "The executive is fighting to contain the growing power of the legislature."
 LAX_congress.4.a:0 "We will resist"
